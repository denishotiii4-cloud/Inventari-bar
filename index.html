<title>Inventari i pijeve – peshorja</title>
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#16241E;--mute:#5B6A62;--line:#D0D8D0;--acc:#8A5209;--accbg:#F6E7CC;--liq:#C98A22;--ok:#1F6B45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1612;--card:#17211B;--ink:#E7EEE8;--mute:#9AAAA0;--line:#2A3930;--acc:#E3AA4F;--accbg:#352810;--liq:#D9A441;--ok:#6FCF9B}}
:root[data-theme="dark"]{--bg:#0F1612;--card:#17211B;--ink:#E7EEE8;--mute:#9AAAA0;--line:#2A3930;--acc:#E3AA4F;--accbg:#352810;--liq:#D9A441;--ok:#6FCF9B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}html{-webkit-text-size-adjust:100%}button,summary{touch-action:manipulation}body{background:var(--bg);color:var(--ink);font:16px/1.45 "Archivo","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 14px;letter-spacing:-.01em}h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.u{flex:0 0 96px}
.bars{display:flex;gap:6px}.bars button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.bars button[aria-pressed=true]{background:var(--acc);color:var(--card);border-color:var(--acc);font-weight:700}
.res{display:flex;gap:16px;align-items:center}
.bottle{position:relative;width:64px;height:150px;border:3px solid var(--ink);border-radius:26px 26px 12px 12px;margin-top:18px;overflow:hidden;flex:none;background:var(--bg)}
.bottle::before{content:"";position:absolute;top:0;left:50%;width:0}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--liq);transition:height .35s}
.neck{width:26px;height:18px;border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;margin:0 0 -3px 19px}
.bw{flex:none}.big{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em}.big small{font-size:1.1rem;font-weight:600;margin-left:4px}
.facts{color:var(--mute);font-size:.85rem;margin-top:8px}.msg{color:var(--acc);font-size:.9rem;margin-top:8px;min-height:1.3em}
.btn{width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;background:var(--acc);color:var(--card);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}.btn.s{background:none;border:1px solid var(--line);color:var(--ink);width:auto;padding:8px 12px;margin:0;font-weight:500}
details summary{cursor:pointer;color:var(--acc);font-weight:600}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.li b{font-variant-numeric:tabular-nums}.li button{border:0;background:none;color:var(--mute);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:8px 10px;background:var(--accbg);border-radius:8px;margin-top:10px}
.empty{color:var(--mute)}.acts{display:flex;gap:8px;margin-top:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:none;padding:9px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:600;border-top:0}th:first-child,td:first-child{text-align:left}tfoot td{font-weight:700;background:var(--accbg)}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:9}
.lock .card{width:100%;max-width:360px;margin:0}.err{color:var(--acc);min-height:1.3em;font-size:.9rem;margin-top:8px}
.acts{flex-wrap:wrap}
.sl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--card)}
.sl button{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:1rem}
.sl small{color:var(--mute);margin-left:4px}
.sl{max-height:360px}.sl small{display:block;margin:2px 0 0;font-size:.78rem}
.gh{position:sticky;top:0;background:var(--accbg);color:var(--acc);font-weight:700;padding:6px 12px;font-size:.8rem;z-index:1}
</style></head><body><div class="lock" id="lock"><div class="card"><h2>Inventari i pijeve</h2>

</div>

function zip(files){const te=new TextEncoder(),L=[],C=[],w16=(a,v)=>a.push(v&255,v>>8&255),w32=(a,v)=>a.push(v&255,v>>8&255,v>>16&255,v>>>24&255);let off=0;

  w32(e,0x02014b50);w16(e,20);w16(e,20);w16(e,0x0800);w16(e,0);w16(e,0);w16(e,0x21);w32(e,c);w32(e,d.length);w32(e,d.length);w16(e,nb.length);w16(e,0);w16(e,0);w16(e,0);w16(e,0);w32(e,0);w32(e,off);
  C.push(Uint8Array.from(e),nb);off+=h.length+nb.length+d.length});

const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sheetXml(aoa,w){let h=HD+'<worksheet '+NS+'><cols>'+w.map((x,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+x+'" customWidth="1"/>').join("")+'</cols><sheetData>';

  if(c&&typeof c==="object")h+='<c r="'+ref+'"'+st+'><f>'+xe(c.f)+'</f><v>'+c.v+'</v></c>';

function xlsx(sheets){const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships",CT="application/vnd.openxmlformats-officedocument.spreadsheetml.";

 ["xl/styles.xml",HD+'<styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']];

async function exp(sheets,fn,btn){const back="Eksporto në Excel";
 if(sheets[0][1].length<3){flash(btn,"Nuk ka çfarë të eksportohet",back);return}

   if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e&&e.name==="AbortError")return;throw e}}
   else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}}

 catch(e){flash(btn,e&&e.code==="declined"?back:"Eksporti dështoi",back)}}
